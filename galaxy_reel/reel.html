<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Galaxy 30s Reel</title>
<style>
  @font-face { font-family: P; font-weight: 300; src: url(fonts/Pretendard-Light.woff2) format("woff2"); }
  @font-face { font-family: P; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format("woff2"); }
  @font-face { font-family: P; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format("woff2"); }
  @font-face { font-family: P; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format("woff2"); }
  @font-face { font-family: P; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format("woff2"); }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  body { font-family: P, sans-serif; color: #fff; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg { position: absolute; inset: 0; }

  /* ---------- 3D 폰 ---------- */
  .scene3d { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 50%; }
  .phone {
    position: absolute; left: 50%; top: 50%;
    width: 520px; height: 1100px; margin: -550px 0 0 -260px;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute; inset: 0; border-radius: 74px;
    backface-visibility: hidden; overflow: hidden;
  }
  .front {
    background: linear-gradient(135deg, #3a3d44, #15161a 40%, #2b2d33);
    padding: 14px;
    box-shadow: 0 0 0 2px #55585f inset;
  }
  .screen {
    position: relative; width: 100%; height: 100%; border-radius: 62px; overflow: hidden;
    background: #000;
  }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .punch { position: absolute; left: 50%; top: 34px; width: 34px; height: 34px; margin-left: -17px;
           border-radius: 50%; background: radial-gradient(circle at 40% 40%, #2a3550, #000 60%); z-index: 3; }
  .ui { position: absolute; inset: 0; z-index: 2; }
  .clock { position: absolute; top: 210px; width: 100%; text-align: center; font-weight: 300; font-size: 150px; letter-spacing: -4px; }
  .date { position: absolute; top: 400px; width: 100%; text-align: center; font-weight: 500; font-size: 34px; opacity: .85; }
  .status { position: absolute; top: 34px; left: 56px; right: 56px; display: flex; justify-content: space-between;
            font-size: 26px; font-weight: 600; }
  .back {
    transform: rotateY(180deg);
    box-shadow: 0 0 0 2px rgba(255,255,255,.18) inset;
  }
  .back .gloss { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.0) 30%, rgba(255,255,255,.22) 45%, rgba(255,255,255,0) 60%); }
  .lens {
    position: absolute; left: 70px; width: 128px; height: 128px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #0a0d18 0 30%, #1b2338 31% 46%, #06070b 47% 62%, #3c3f47 63% 70%, #9aa0aa 71% 74%, #2c2f36 75%);
    box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 0 3px rgba(255,255,255,.08);
  }
  .lens::after { content: ""; position: absolute; left: 34%; top: 30%; width: 14%; height: 14%; border-radius: 50%;
                 background: rgba(160,190,255,.7); filter: blur(2px); }
  .flash { position: absolute; left: 230px; top: 110px; width: 40px; height: 40px; border-radius: 50%;
           background: radial-gradient(circle, #fff6d8, #c9b98a 60%, #5d574a); }
  .brand-back { position: absolute; bottom: 110px; width: 100%; text-align: center; font-size: 40px; font-weight: 600; letter-spacing: 6px; opacity: .55; }

  /* ---------- 텍스트 ---------- */
  .txt { position: absolute; left: 0; width: 100%; text-align: center; will-change: transform, opacity; }
  .h1 { font-weight: 800; font-size: 150px; letter-spacing: -3px; line-height: 1; }
  .h2 { font-weight: 700; font-size: 96px; letter-spacing: -2px; line-height: 1.1; }
  .sub { font-weight: 500; font-size: 46px; letter-spacing: -0.5px; opacity: .85; }
  .grad { background: linear-gradient(90deg, #8fb8ff, #c8a6ff 50%, #ffb3e6); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .chip { position: absolute; padding: 26px 44px; border-radius: 60px; font-weight: 600; font-size: 44px;
          background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28);
          backdrop-filter: blur(14px); white-space: nowrap; }
  .chip b { color: #b9a2ff; margin-right: 12px; }

  #ring { position: absolute; left: 50%; top: 50%; width: 620px; height: 620px; margin: -310px 0 0 -310px; }
  #battPct { position: absolute; top: 50%; width: 100%; text-align: center; margin-top: -90px; font-weight: 800; font-size: 170px; letter-spacing: -4px; }

  #flash { position: absolute; inset: 0; background: #fff; pointer-events: none; }
  #vignette { position: absolute; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.6) 100%); }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>

  <div class="scene3d" id="s3d">
    <!-- 메인 폰 -->
    <div class="phone" id="phoneMain">
      <div class="face front">
        <div class="screen">
          <canvas id="wall" width="492" height="1072"></canvas>
          <div class="punch"></div>
          <div class="ui" id="lockUI">
            <div class="status"><span>9:41</span><span>5G ▮▮▮ 100%</span></div>
            <div class="clock">9:41</div>
            <div class="date">11월 7일 토요일</div>
          </div>
        </div>
      </div>
      <div class="face back" id="backMain" style="background: linear-gradient(160deg,#6d6a8c,#3b3953 55%,#2a283b);">
        <div class="gloss"></div>
        <div class="lens" style="top:60px"></div>

        <div class="lens" style="top:360px"></div>

    </div>

    <!-- 아웃트로 컬러 라인업 -->
    <div class="phone lineup" id="phoneL">
      <div class="face front" style="background:#222"></div>
      <div class="face back" style="background: linear-gradient(160deg,#d9e4f5,#a9b8d2 55%,#8494b3);">
        <div class="gloss"></div>

      </div>
    </div>
    <div class="phone lineup" id="phoneR">
      <div class="face front" style="background:#222"></div>
      <div class="face back" style="background: linear-gradient(160deg,#c9e8da,#8fbfa9 55%,#5f8f7b);">
        <div class="gloss"></div>
        <div class="lens" style="top:60px"></div><div class="lens" style="top:210px"></div><div class="lens" style="top:360px"></div>
        <div class="flash"></div><div class="brand-back" style="color:#233">Galaxy</div>
      </div>
    </div>
  </div>

  <!-- 배터리 링 -->
  <canvas id="ring" width="620" height="620"></canvas>
  <div id="battPct">0%</div>

  <!-- 텍스트 레이어 -->
  <div class="txt sub" id="t_intro" style="top:880px; font-size:64px; font-weight:600;">새로운 차원이 열린다</div>

  <div class="txt h1" id="t_galaxy" style="top:170px;">Galaxy</div>
  <div class="txt sub" id="t_galaxySub" style="top:345px;">손 안의 새로운 세계</div>

  <div class="txt h2" id="t_cam" style="top:1420px;">프로급 카메라</div>
  <div class="txt sub" id="t_camSub" style="top:1545px;">모든 순간을 선명하게</div>

  <div class="txt h2" id="t_night" style="top:150px;">밤에도 밝게</div>
  <div class="txt sub" id="t_nightSub" style="top:270px;">더 가까이, 더 선명하게</div>

  <div class="txt h1 grad" id="t_ai" style="top:300px; font-size:170px;">Galaxy AI</div>
  <div class="chip" id="c1"><b>✦</b>실시간 통역</div>
  <div class="chip" id="c2"><b>✦</b>서클 투 서치</div>
  <div class="chip" id="c3"><b>✦</b>노트 어시스트</div>
  <div class="chip" id="c4"><b>✦</b>포토 어시스트</div>

  <div class="txt h2" id="t_disp" style="top:150px;">압도적인 디스플레이</div>
  <div class="txt h2" id="t_perf" style="top:150px;">강력한 성능</div>
  <div class="txt sub" id="t_perfSub" style="top:270px;">게임도, 작업도 끊김 없이</div>

  <div class="txt h2" id="t_batt" style="top:330px;">하루 종일 든든하게</div>
  <div class="txt sub" id="t_battSub" style="top:1450px;">오래가는 배터리 · 초고속 충전</div>

  <div class="txt h1" id="t_end" style="top:1370px; font-size:180px;">Galaxy</div>
  <div class="txt sub" id="t_endSub" style="top:1580px; font-weight:600;">지금 만나보세요</div>

  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script>
// ===================================================================
// 결정적(deterministic) 렌더: render(t) 한 번 호출 = 프레임 한 장
// 120 BPM → 0.5초마다 1박, 2초마다 1마디 (음악과 동기)
// ===================================================================
const W = 1080, H = 1920;
const $ = id => document.getElementById(id);
const bg = $('bg').getContext('2d');
const wall = $('wall').getContext('2d');
const ringC = $('ring').getContext('2d');

// ---------- 유틸 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(42);

// 등장/퇴장 창: [in시작, in끝, out시작, out끝]
function win(t, a, b, c, d) { return Math.min(eOut(prog(t, a, b)), 1 - eIn(prog(t, c, d))); }

function setTxt(id, t, a, b, c, d, dy = 60, blur = true) {
  const el = $(id), k = win(t, a, b, c, d);
  el.style.opacity = k;
  el.style.display = k <= 0.001 ? 'none' : 'block';
  const outK = prog(t, c, d);
  const y = (1 - eOut(prog(t, a, b))) * dy - outK * dy * 0.6;
  el.style.transform = `translateY(${y}px) scale(${1 + outK * 0.04})`;
  el.style.filter = blur ? `blur(${(1 - k) * 14}px)` : 'none';
}

// 박자 펄스 (박 직후 1 → 감쇠)
function pulse(t, from, to, perBeat = 1) {
  if (t < from || t > to) return 0;
  const b = (t - from) * 2 * perBeat;
  return Math.exp(-(b - Math.floor(b)) * 5);
}

// ---------- 배경 리소스 ----------
const STARS = Array.from({ length: 700 }, () => ({
  x: (rnd() - .5) * 2, y: (rnd() - .5) * 2, z: rnd(), s: rnd() * 1.6 + .4, tw: rnd() * 6.28
}));
const DUST = Array.from({ length: 140 }, () => ({ a: rnd() * 6.28, r: rnd(), sp: rnd() * .6 + .2, s: rnd() * 3 + 1 }));
const BUILD = Array.from({ length: 40 }, (_, i) => ({ w: 30 + rnd() * 60, h: 180 + rnd() * 520, x: i / 40, win: rnd() }));

// 테마 색 (씬마다 보간)
const THEMES = [
  // [t, 위색, 아래색, 성운색1, 성운색2]
  [0,   [2, 3, 10],  [4, 4, 16],  [60, 80, 255],  [140, 60, 255]],
  [2,   [6, 8, 26],  [2, 2, 8],   [70, 110, 255], [170, 90, 255]],
  [6,   [4, 6, 16],  [10, 6, 22], [255, 150, 90], [120, 80, 255]],
  [10,  [2, 4, 14],  [8, 10, 30], [40, 120, 255], [255, 120, 200]],
  [14,  [18, 6, 46], [4, 8, 40],  [150, 90, 255], [60, 160, 255]],
  [18,  [2, 10, 30], [20, 4, 30], [0, 200, 255],  [255, 60, 160]],
  [22,  [2, 14, 18], [2, 4, 12],  [40, 255, 170], [60, 140, 255]],
  [26,  [8, 8, 24],  [2, 2, 6],   [120, 140, 255],[220, 160, 255]],
];
function theme(t) {
  let i = 0; while (i < THEMES.length - 1 && t >= THEMES[i + 1][0]) i++;
  const A = THEMES[i], B = THEMES[Math.min(i + 1, THEMES.length - 1)];
  const k = A === B ? 0 : eIO(prog(t, B[0] - 0.6, B[0]));
  const mix = (p, q) => p.map((v, j) => Math.round(lerp(v, q[j], k)));
  return [mix(A[1], B[1]), mix(A[2], B[2]), mix(A[3], B[3]), mix(A[4], B[4])];
}
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function drawBG(t) {
  const [top, bot, n1, n2] = theme(t);
  const g = bg.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);

  // 성운 블롭
  const beat = pulse(t, 14, 24) * 0.25 + pulse(t, 2, 12, 0.5) * 0.08;
  bg.globalCompositeOperation = 'lighter';
  const blobs = [
    [W * (.3 + .1 * Math.sin(t * .4)), H * (.35 + .05 * Math.cos(t * .3)), 700, n1, .35],
    [W * (.75 + .08 * Math.cos(t * .35)), H * (.65 + .06 * Math.sin(t * .5)), 800, n2, .3],
    [W * .5, H * (.5 + .1 * Math.sin(t * .2)), 500, n1, .18],
  ];
  for (const [x, y, r, c, a] of blobs) {
    const rg = bg.createRadialGradient(x, y, 0, x, y, r * (1 + beat));
    rg.addColorStop(0, rgb(c, a * (1 + beat))); rg.addColorStop(1, rgb(c, 0));
    bg.fillStyle = rg; bg.fillRect(0, 0, W, H);
  }

  // 별: 인트로 워프 + 이후 천천히 흐름
  const warp = t < 2.2 ? lerp(0.05, 1.6, eIn(prog(t, 0, 2))) : (t > 13 && t < 14.1 ? 1.2 * eIn(prog(t, 13, 14)) : (t > 25 && t < 26.1 ? 1.4 * eIn(prog(t, 25, 26)) : 0.04));
  for (const s of STARS) {
    let z = (s.z - t * 0.04 - (t < 2.2 ? eIn(prog(t, 0, 2)) * 0.9 : 0)) % 1; if (z < 0) z += 1;
    z = z * 0.95 + 0.05;
    const px = W / 2 + s.x / z * 420, py = H / 2 + s.y / z * 420;
    if (px < -50 || px > W + 50 || py < -50 || py > H + 50) continue;
    const a = clamp((1 - z) * 1.3) * (0.6 + 0.4 * Math.sin(t * 3 + s.tw));
    const len = warp * 60 / z;
    bg.strokeStyle = `rgba(220,230,255,${a})`;
    bg.lineWidth = s.s * (1.2 - z);
    bg.beginPath();
    const dx = (px - W / 2), dy = (py - H / 2), d = Math.hypot(dx, dy) + 1e-3;
    bg.moveTo(px, py); bg.lineTo(px - dx / d * len - 0.5, py - dy / d * len - 0.5);
    bg.stroke();
  }

  // 반짝이는 먼지 (회전)
  for (const p of DUST) {
    const ang = p.a + t * p.sp * 0.3, rr = 200 + p.r * 700;
    const x = W / 2 + Math.cos(ang) * rr, y = H / 2 + Math.sin(ang) * rr * 1.5;
    bg.fillStyle = rgb(n2, 0.25 + 0.25 * Math.sin(t * 2 + p.a * 5));
    bg.beginPath(); bg.arc(x, y, p.s, 0, 6.28); bg.fill();
  }

  // 인트로 중앙 광원
  if (t < 3) {
    const k = eIn(prog(t, 0.2, 2)) * (1 - prog(t, 2, 3));
    const rg = bg.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 200 + 900 * k);
    rg.addColorStop(0, `rgba(200,215,255,${0.9 * k})`); rg.addColorStop(.3, `rgba(110,130,255,${0.35 * k})`); rg.addColorStop(1, 'rgba(0,0,0,0)');
    bg.fillStyle = rg; bg.fillRect(0, 0, W, H);
    // 수평 렌즈 플레어
    bg.fillStyle = `rgba(170,190,255,${0.5 * k})`;
    bg.fillRect(0, H / 2 - 2 - 3 * k, W, 4 + 6 * k);
  }

  // 오빗 링 (인트로 & 아웃트로)
  const ringK = Math.max(win(t, 0.3, 1.6, 2.0, 2.6), win(t, 26.2, 27.4, 31, 32));
  if (ringK > 0) {
    bg.save(); bg.translate(W / 2, t > 20 ? 1060 : H / 2); bg.rotate(-0.35 + t * 0.15); bg.scale(1, 0.28);
    for (let i = 0; i < 3; i++) {
      bg.strokeStyle = rgb(i % 2 ? n1 : n2, 0.55 * ringK);
      bg.lineWidth = 4 - i;
      bg.beginPath(); bg.arc(0, 0, 330 + i * 70 + ringK * 40, 0, 6.28); bg.stroke();
    }
    bg.restore();
  }

  // 디스플레이/성능 씬: 스피드 라인
  const sk = win(t, 18, 18.4, 21.6, 22);
  if (sk > 0) {
    for (let i = 0; i < 46; i++) {
      const yy = (i * 97 + 13) % H, sp = 900 + (i * 53 % 700);
      const xx = ((t * sp + i * 311) % (W + 600)) - 300;
      const lg = bg.createLinearGradient(xx - 260, 0, xx, 0);
      const c = i % 2 ? n1 : n2;
      lg.addColorStop(0, rgb(c, 0)); lg.addColorStop(1, rgb(c, 0.55 * sk));
      bg.fillStyle = lg; bg.fillRect(xx - 260, yy, 260, 3 + (i % 3));
    }
  }
  bg.globalCompositeOperation = 'source-over';
}

// ---------- 폰 화면(배경화면) ----------
function drawWall(t, mode) {
  const w = 492, h = 1072;
  if (mode === 'night') {
    // 야경: 줌 + 밝기 상승
    const z = 1 + eIO(prog(t, 10.3, 13.6)) * 1.8;
    const bright = eOut(prog(t, 10.2, 12.2));
    const sky = wall.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, `rgb(${lerp(3, 22, bright)},${lerp(4, 30, bright)},${lerp(12, 80, bright)})`);
    sky.addColorStop(1, `rgb(${lerp(10, 120, bright)},${lerp(6, 60, bright)},${lerp(20, 110, bright)})`);
    wall.fillStyle = sky; wall.fillRect(0, 0, w, h);
    // 달
    wall.fillStyle = `rgba(255,245,220,${0.4 + 0.6 * bright})`;
    wall.beginPath(); wall.arc(w * .7, 230 - (z - 1) * 40, 38 * z, 0, 6.28); wall.fill();
    wall.save(); wall.translate(w / 2, h); wall.scale(z, z); wall.translate(-w / 2, -h);
    for (const b of BUILD) {
      const x = b.x * (w + 120) - 60, bh = b.h;
      wall.fillStyle = `rgb(${lerp(5, 30, bright)},${lerp(6, 34, bright)},${lerp(14, 60, bright)})`;
      wall.fillRect(x, h - bh, b.w, bh);
      for (let yy = h - bh + 16; yy < h - 10; yy += 26) for (let xx = x + 8; xx < x + b.w - 8; xx += 16) {
        if (((xx * 7 + yy * 13) | 0) % 5 < 2) continue;
        wall.fillStyle = `rgba(255,${200 + ((xx | 0) % 50)},120,${(0.25 + 0.75 * bright) * (0.4 + b.win * 0.6)})`;
        wall.fillRect(xx, yy, 7, 11);
      }
    }
    wall.restore();
    // 카메라 UI 프레임
    wall.strokeStyle = 'rgba(255,255,255,.7)'; wall.lineWidth = 3;
    const fx = w / 2, fy = h * .55, fs = 90 - eOut(prog(t, 10.5, 11.2)) * 20;
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      wall.beginPath(); wall.moveTo(fx + sx * fs, fy + sy * (fs - 26)); wall.lineTo(fx + sx * fs, fy + sy * fs); wall.lineTo(fx + sx * (fs - 26), fy + sy * fs); wall.stroke();
    }
    // 줌 배율 표시 (숫자 없이 막대 인디케이터)
    wall.fillStyle = 'rgba(0,0,0,.45)'; wall.beginPath(); wall.roundRect(w / 2 - 150, h - 200, 300, 70, 35); wall.fill();
    for (let i = 0; i < 5; i++) {
      const on = (z - 1) / 1.8 * 4 >= i - 0.01;
      wall.fillStyle = on ? '#ffd76a' : 'rgba(255,255,255,.5)';
      wall.beginPath(); wall.arc(w / 2 - 100 + i * 50, h - 165, on ? 12 : 8, 0, 6.28); wall.fill();
    }
    return;
  }
  // 기본: 흐르는 그라데이션 블롭 배경화면
  const speed = mode === 'vivid' ? 2.4 : 0.6;
  const tt = t * speed;
  wall.fillStyle = mode === 'vivid' ? '#0a0320' : '#070a1f'; wall.fillRect(0, 0, w, h);
  wall.globalCompositeOperation = 'lighter';
  const cols = mode === 'vivid'
    ? [[255, 40, 140], [0, 200, 255], [255, 170, 0], [140, 60, 255]]
    : [[70, 110, 255], [160, 80, 255], [40, 200, 255], [255, 120, 200]];
  for (let i = 0; i < 4; i++) {
    const x = w * (0.5 + 0.4 * Math.sin(tt * 0.7 + i * 1.7)), y = h * (0.5 + 0.38 * Math.cos(tt * 0.5 + i * 2.3));
    const r = 420 + 80 * Math.sin(tt + i);
    const g = wall.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgb(cols[i], 0.85)); g.addColorStop(1, rgb(cols[i], 0));
    wall.fillStyle = g; wall.fillRect(0, 0, w, h);
  }
  wall.globalCompositeOperation = 'source-over';
}

// ---------- 배터리 링 ----------
function drawRing(t) {
  const el = $('ring'), pct = $('battPct');
  const vis = win(t, 22, 22.5, 25.7, 26);
  el.style.opacity = vis; pct.style.opacity = vis;
  el.style.display = pct.style.display = vis <= 0 ? 'none' : 'block';
  if (vis <= 0) return;
  const k = eIO(prog(t, 22.3, 25.2));
  ringC.clearRect(0, 0, 620, 620);
  const cx = 310, cy = 310, r = 250;
  ringC.lineCap = 'round';
  ringC.lineWidth = 34; ringC.strokeStyle = 'rgba(255,255,255,.1)';
  ringC.beginPath(); ringC.arc(cx, cy, r, 0, 6.28); ringC.stroke();
  const g = ringC.createLinearGradient(0, 0, 620, 620);
  g.addColorStop(0, '#3dffb0'); g.addColorStop(1, '#3d8bff');
  ringC.strokeStyle = g; ringC.shadowColor = '#3dffc0'; ringC.shadowBlur = 40;
  ringC.beginPath(); ringC.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + 6.283 * Math.max(0.001, k)); ringC.stroke();
  ringC.shadowBlur = 0;
  // 번개 아이콘
  ringC.fillStyle = `rgba(160,255,220,${0.6 + 0.4 * pulse(t, 22, 26)})`;
  ringC.beginPath(); ringC.moveTo(330, 470); ringC.lineTo(290, 545); ringC.lineTo(318, 545); ringC.lineTo(300, 600); ringC.lineTo(345, 520); ringC.lineTo(316, 520); ringC.closePath(); ringC.fill();
  pct.textContent = Math.round(k * 100) + '%';
  const s = 0.85 + 0.15 * eBack(prog(t, 22, 22.7)) + pulse(t, 24, 26, 2) * 0.03;
  el.style.transform = pct.style.transform = `scale(${s})`;
}

// ---------- 폰 변환 ----------
function setPhone(el, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1, o = 1 }) {
  el.style.opacity = o;
  el.style.display = o <= 0.001 ? 'none' : 'block';
  el.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
}

// ===================================================================
function render(t) {
  drawBG(t);

  // ---------------- 메인 폰 타임라인 ----------------
  const P = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0, s: 1, o: 0 };
  let wallMode = 'calm';
  if (t >= 2 && t < 6) {                     // S2 리빌
    const k = eOut(prog(t, 2, 3.4));
    P.o = prog(t, 2, 2.3);
    P.y = lerp(900, 150, k); P.ry = lerp(-55, -8, k) + Math.sin(t * 1.2) * 4;
    P.rx = lerp(25, 4, k); P.s = lerp(0.8, 0.95, k) + prog(t, 3.4, 6) * 0.04; P.rz = lerp(-8, 0, k);
  } else if (t >= 6 && t < 10) {             // S3 뒷면 카메라
    const k = eIO(prog(t, 6, 7.3));
    const zk = eIO(prog(t, 7.2, 9.6));
    P.o = 1; P.ry = lerp(-8, 180 + 18, k) - zk * 10; P.rx = lerp(4, 6, k);
    P.s = lerp(0.99, 1.1, k) + zk * 0.9;
    P.x = lerp(0, -40, k) + zk * 330; P.y = lerp(150, -40, k) + zk * 520;
    P.rz = zk * -4;
  } else if (t >= 10 && t < 14) {            // S4 야경/줌
    const k = eIO(prog(t, 10, 10.9));
    wallMode = 'night';
    P.o = 1; P.ry = lerp(180 + 8, 360, k); P.rx = lerp(6, 0, k);
    P.s = lerp(2.0, 1.12, k) + prog(t, 10.9, 14) * 0.08; P.x = lerp(330, 0, k); P.y = lerp(480, 120, k);
    if (t > 13.4) { const q = eIn(prog(t, 13.4, 14)); P.s += q * 1.6; P.o = 1 - q; }
  } else if (t >= 14 && t < 18) {            // S5 Galaxy AI: 폰은 아래에 작게
    const k = eOut(prog(t, 14, 14.8));
    P.o = k; P.y = lerp(1000, 640, k); P.s = 0.72; P.rx = 18; P.ry = Math.sin(t * 1.5) * 10;
    if (t > 17.5) P.o = 1 - prog(t, 17.5, 18);
  } else if (t >= 18 && t < 22) {            // S6 디스플레이/성능
    const k = eOut(prog(t, 18, 18.7));
    wallMode = 'vivid';
    P.o = k; P.s = lerp(0.7, 1.0, k) + pulse(t, 18, 22) * 0.02;
    P.rz = lerp(-30, -12, k) + (t > 20 ? eIO(prog(t, 20, 20.6)) * 24 : 0);
    P.ry = lerp(40, 14, k) - (t > 20 ? eIO(prog(t, 20, 20.6)) * 28 : 0);
    P.rx = 10; P.y = 160;
    if (t > 21.6) P.o = 1 - prog(t, 21.6, 22);
  } else if (t >= 26) {                      // S8 아웃트로 (가운데 = 메인 폰 뒷면)
    const k = eOut(prog(t, 26, 27.2));
    P.o = prog(t, 26, 26.3); P.ry = 180 + lerp(40, 0, k); P.s = lerp(0.5, 0.78, k); P.y = lerp(-200, -180, k) ; P.z = 60;
    P.rx = lerp(30, 0, k);
  }
  setPhone($('phoneMain'), P);
  if (P.o > 0) drawWall(t, wallMode);
  $('lockUI').style.opacity = wallMode === 'calm' ? 1 : 0;

  // 아웃트로 라인업
  const kL = eOut(prog(t, 26.25, 27.6));
  const lo = prog(t, 26.25, 26.6);
  setPhone($('phoneL'), { o: t >= 26 ? lo : 0, x: lerp(0, -330, kL), y: -150, z: -80, ry: 180 + lerp(40, 24, kL), rz: lerp(0, -6, kL), s: 0.7 });
  setPhone($('phoneR'), { o: t >= 26 ? lo : 0, x: lerp(0, 330, kL), y: -150, z: -80, ry: 180 + lerp(40, -24, kL), rz: lerp(0, 6, kL), s: 0.7 });

  // ---------------- 텍스트 ----------------
  setTxt('t_intro', t, 0.5, 1.3, 1.65, 1.95, 40);
  $('t_intro').style.letterSpacing = lerp(30, 2, eOut(prog(t, 0.5, 1.9))) + 'px';

  setTxt('t_galaxy', t, 2.5, 3.3, 5.5, 5.95, 80);
  $('t_galaxy').style.letterSpacing = lerp(40, -3, eOut(prog(t, 2.5, 3.6))) + 'px';
  setTxt('t_galaxySub', t, 3.1, 3.8, 5.5, 5.95, 40);

  setTxt('t_cam', t, 7.0, 7.7, 9.5, 9.95, 70);
  setTxt('t_camSub', t, 7.4, 8.1, 9.5, 9.95, 40);

  setTxt('t_night', t, 10.6, 11.3, 13.3, 13.8, 60);
  setTxt('t_nightSub', t, 11.0, 11.7, 13.3, 13.8, 40);

  // Galaxy AI (드롭)
  setTxt('t_ai', t, 14.0, 14.5, 17.5, 17.95, 0);
  const aiS = 1 + pulse(t, 14, 17.5) * 0.04 + (1 - eBack(prog(t, 14, 14.6))) * 0.4;
  $('t_ai').style.transform += ` scale(${aiS})`;
  const chips = [
    ['c1', 14.5, 160, 620, -1], ['c2', 15.0, 470, 800, 1],
    ['c3', 15.5, 120, 980, -1], ['c4', 16.0, 430, 1160, 1],
  ];
  for (const [id, st, x, y, dir] of chips) {
    const el = $(id), k = win(t, st, st + 0.45, 17.4, 17.9);
    el.style.display = k <= 0 ? 'none' : 'block';
    el.style.opacity = k;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    const pop = eBack(prog(t, st, st + 0.45));
    el.style.transform = `translateX(${(1 - pop) * dir * 160}px) scale(${0.6 + 0.4 * pop + pulse(t, st + 0.5, 17.4) * 0.03}) translateY(${Math.sin(t * 2 + st) * 8}px)`;
  }

  setTxt('t_disp', t, 18.3, 18.9, 19.7, 20.0, 60);
  setTxt('t_perf', t, 20.1, 20.6, 21.5, 21.95, 60);
  setTxt('t_perfSub', t, 20.4, 21.0, 21.5, 21.95, 40);

  setTxt('t_batt', t, 22.2, 22.8, 25.6, 25.95, 60);
  setTxt('t_battSub', t, 22.7, 23.3, 25.6, 25.95, 40);
  drawRing(t);

  setTxt('t_end', t, 26.6, 27.5, 31, 32, 60);
  $('t_end').style.letterSpacing = lerp(50, -2, eOut(prog(t, 26.6, 28))) + 'px';
  setTxt('t_endSub', t, 27.4, 28.1, 31, 32, 40);

  // ---------------- 플래시 / 페이드 ----------------
  const flashes = [[2, .9], [14, .75], [26, 1]];
  let f = 0;
  for (const [ft, a] of flashes) if (t >= ft - 0.08) f = Math.max(f, a * (t < ft ? prog(t, ft - 0.08, ft) : Math.exp(-(t - ft) * 7)));
  if (t < 2.0) f = Math.max(f, prog(t, 1.85, 2.0) * 0.9);
  $('flash').style.opacity = f;
  $('fade').style.opacity = Math.max(1 - prog(t, 0, 0.4), prog(t, 29.1, 30));
}

window.render = render;
window.ready = document.fonts.ready.then(() => document.fonts.load('800 50px P')).then(() => true);
render(0);
</script>
</body>
</html>
